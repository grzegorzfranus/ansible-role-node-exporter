---
# ==============================================================================
# Ansible Role Configuration Assembly: grzegorzfranus.node_exporter
# ==============================================================================

- name: "Node-Exporter | configure | Assemble command-line arguments"
  ansible.builtin.set_fact:
    __node_exporter_flag_listen: >-
      --web.listen-address={{ node_exporter_listen_address if node_exporter_listen_address != "" else "" }}:{{ node_exporter_port }}
    __node_exporter_flag_telemetry: "--web.telemetry-path={{ node_exporter_telemetry_path }}"
    __node_exporter_flags_enabled: "{{ node_exporter_enabled_collectors | map('regex_replace', '^(.*)$', '--collector.\\1') | list }}"
    __node_exporter_flags_disabled: "{{ node_exporter_disabled_collectors | map('regex_replace', '^(.*)$', '--no-collector.\\1') | list }}"
    __node_exporter_flag_textfile: >-
      {{ ["--collector.textfile.directory=" ~ node_exporter_textfile_directory] if (node_exporter_textfile_directory is defined and node_exporter_textfile_directory != "") else [] }}

- name: "Node-Exporter | configure | Combine all flag parts into argument string"
  ansible.builtin.set_fact:
    __node_exporter_args: >-
      {{
        ([__node_exporter_flag_listen, __node_exporter_flag_telemetry] +
         __node_exporter_flags_enabled +
         __node_exporter_flags_disabled +
         __node_exporter_flag_textfile +
         node_exporter_extra_args) | join(' ')
      }}

- name: "Node-Exporter | configure | Assemble ReadWritePaths for systemd hardening"
  ansible.builtin.set_fact:
    __node_exporter_read_write_paths: >-
      {{
        (node_exporter_read_write_paths +
         ([node_exporter_textfile_directory] if (node_exporter_textfile_directory is defined and node_exporter_textfile_directory != "") else [])) | unique | list
      }}
