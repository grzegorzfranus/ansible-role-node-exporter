---
# ==============================================================================
# Ansible Role Configuration Assembly: grzegorzfranus.node_exporter
# ==============================================================================

- name: "Node-Exporter | configure | Assemble CLI arguments and systemd ReadWritePaths"
  ansible.builtin.set_fact:
    __node_exporter_args: >-
      {{
        ([__flag_listen, __flag_telemetry] +
         __flags_enabled +
         __flags_disabled +
         __flag_textfile +
         node_exporter_extra_args) | join(' ')
      }}
    __node_exporter_read_write_paths: >-
      {{
        (node_exporter_read_write_paths +
         ([node_exporter_textfile_directory]
          if (node_exporter_textfile_directory is defined and node_exporter_textfile_directory != "")
          else [])) | unique | list
      }}
  vars:
    __flag_listen: >-
      --web.listen-address={{
        ('[' ~ node_exporter_listen_address ~ ']')
        if (':' in node_exporter_listen_address and not node_exporter_listen_address.startswith('['))
        else node_exporter_listen_address
      }}:{{ node_exporter_port }}
    __flag_telemetry: "--web.telemetry-path={{ node_exporter_telemetry_path }}"
    __flags_enabled: "{{ node_exporter_enabled_collectors | map('regex_replace', '^(.*)$', '--collector.\\1') | list }}"
    __flags_disabled: "{{ node_exporter_disabled_collectors | map('regex_replace', '^(.*)$', '--no-collector.\\1') | list }}"
    __flag_textfile: >-
      {{
        ["--collector.textfile.directory=" ~ node_exporter_textfile_directory]
        if (node_exporter_textfile_directory is defined and node_exporter_textfile_directory != "")
        else []
      }}
