---
# ==============================================================================
# Ansible Role Health Check Test: grzegorzfranus.node_exporter
# ==============================================================================

- name: "Node-Exporter | test | Query metrics HTTP endpoint"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}{{ node_exporter_telemetry_path }}"
    method: GET
    status_code: 200
    return_content: true
  register: __node_exporter_metrics_response
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: "Node-Exporter | test | Assert metrics endpoint health response"
  ansible.builtin.assert:
    that:
      - __node_exporter_metrics_response.status is defined
      - __node_exporter_metrics_response.status == 200
      - __node_exporter_metrics_response.content is defined
      - "'node_cpu_seconds_total' in __node_exporter_metrics_response.content or 'node_exporter' in __node_exporter_metrics_response.content"
    fail_msg: >-
      Health check failed: GET http://127.0.0.1:{{ node_exporter_port }}{{ node_exporter_telemetry_path }}
      returned status {{ __node_exporter_metrics_response.status | default('N/A') }}.
    success_msg: >-
      Health check passed: node_exporter metrics endpoint is responding with 200 OK.
  when: not ansible_check_mode
