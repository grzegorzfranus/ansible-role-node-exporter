---
# ==============================================================================
# Ansible Role Service User & Group: grzegorzfranus.node_exporter
# ==============================================================================

- name: "Node-Exporter | user | Create system group"
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    state: present
    system: true
  become: true

- name: "Node-Exporter | user | Create system user"
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    state: present
    system: true
    shell: "/sbin/nologin"
    create_home: false
  become: true
